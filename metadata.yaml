name: astrbot_plugin_fish_house
display_name: 大肥鱼的小屋
short_desc: 主题画布驱动的视频壁纸，素材库 + 画布节点，独立链接观看
desc: |
  把「大肥鱼」做成一个视频壁纸：

  - 主题画布驱动：节点按画布连线播放，循环节点等待消息、收到消息自动推进；
  - 节点之间叠化衔接，一次性节点播完自动走下一个，多条出边时交给模型选择；
  - 素材库统一管理视频，画布节点只挑素材；
  - Vue 3 面板：首页/主题/项目/市场/我的/设置六个 Tab；
  - 主题项目：每个项目独立素材与画布，可复制/保存/应用；
  - 主题：整套配置可导出/导入/应用，自带主题市场（FastAPI 服务端）；
  - 活动气泡：每次进入节点由模型现写一句，显示 3 秒后淡出；
  - 提供独立公共链接，不需要登录 AstrBot 面板也能看壁纸。
version: 3.0.1
author: jiuchai
astrbot_version: ">=4.9.0"
support_platforms:
